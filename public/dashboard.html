<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .link-section {
      text-align: center;
      margin: 20px 0;
    }

    .link-section a {
      display: inline-block;
      text-decoration: none;
      background: #007bff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 5px;
      transition: background 0.3s ease;
    }

    .link-section a:hover {
      background: #0056b3;
    }

    .link-section p {
      margin-top: 10px;
      color: #555;
    }

    .upcoming-section {
      margin-top: 40px;
    }

    .upcoming-section h2 {
      color: #333;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
    }

    .upcoming-data {
      margin-top: 15px;
      padding: 15px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 5px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dashboard</h1>

    <div class="link-section">
      <a href="admin.html">Go to Admin Page</a>
      <p>(Click link to visit admin page)</p>
    </div>

    <div class="upcoming-section">
      <h2>Upcoming Data</h2>
      <div class="upcoming-data" id="upcomingData">
        <!-- Data passed from admin.html will appear here -->
        No upcoming data yet. Please check back later.
      </div>
    </div>
  </div>
